; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
framework = espidf
board = esp32dev
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
    -D BAUD_RATE=${env:esp32dev.monitor_speed}
check_tool = clangtidy, cppcheck
check_flags = 
    clangtidy: --checks=*,-modernize-use-trailing-return-type
    cppcheck: --enable=warning,style
lib_deps = 
    vtneil/vt-linalg@^2.1.1
test_framework = unity
extra_scripts = 
    pre:scripts/compile_bitprotos.py
    post:scripts/update_flylint_include_config.py
bitproto_version = v1.2.2

; To run a specific test file, use:
;   pio test -vv -f ADXL345/test_ADXL345
; --- Logic Tests (No hardware required) ---
[env:test_logic]
extends = env:esp32dev
test_filter = 
    kinematics/test_omnidirectional_robot
    IMUGY85/test_find_chips_orientation

; --- Sensor Hardware Tests (Requires sensors connected) ---
[env:test_hardware]
extends = env:esp32dev
test_filter = 
    ADXL345/test_ADXL345
    BL48250/test_bl48250
    IMUGY85/test_IMUGY85
    ITG3200/test_ITG3200
    QMC5883L/test_QMC5883L

; --- Calibration Tests (Interactive/Long running) ---
; Tests that require moving the robot or collecting data
[env:test_calibration]
extends = env:esp32dev
test_filter = 
    ADXL345/test_ADXL345_Calibration
    ITG3200/test_ITG3200_Calibration
    QMC5883L/test_QMC5883L_Calibration
