; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:esp32dev]
platform = espressif32
framework = espidf
board = esp32dev
monitor_speed = 115200
build_flags = 
	-D BAUD_RATE=${env:esp32dev.monitor_speed}
check_tool = clangtidy, cppcheck
check_flags = 
	clangtidy: --checks=*,-modernize-use-trailing-return-type
	cppcheck: --enable=warning,style
lib_deps = 
	remotexy/RemoteXY @^3.1.14
	hideakitai/ArduinoEigen@^0.3.2
	vtneil/vt-linalg@^2.1.1
test_framework = unity
extra_scripts = 
	post:scripts/update_flylint_include_config.py
